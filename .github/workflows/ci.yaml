name: ci

on:
  push:
    paths:
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - ".env"
      - "src/**"
      - "public/**"
      - "vite.config.ts"
      - "tsconfig.json"
      - "tsconfig.app.json"
      - "tsconfig.node.json"
      - "tailwind.config.cjs"
      - "postcss.config.cjs"
      - ".eslintrc.cjs"
      - ".github/workflows/ci.yaml"
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - ".env"
      - "src/**"
      - "public/**"
      - "vite.config.ts"
      - "tsconfig.json"
      - "tsconfig.app.json"
      - "tsconfig.node.json"
      - "tailwind.config.cjs"
      - "postcss.config.cjs"
      - ".eslintrc.cjs"
      - ".github/workflows/ci.yaml"
  workflow_dispatch:

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc -p tsconfig.app.json --noEmit && npx tsc -p tsconfig.node.json --noEmit

      - name: Build
        run: npm run build
